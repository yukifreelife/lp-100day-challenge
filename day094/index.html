<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NemuNoteは、睡眠記録と日々の気づきをやさしく整理するためのノートアプリです。"
    />
    <meta name="theme-color" content="#2f8f83" />
    <title>NemuNote | 睡眠と気づきを記録するノートアプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nemu: {
                paper: "#fcfcf8",
                mint: "#8fd8c4",
                teal: "#2f8f83",
                coral: "#f7b8a6",
                lavender: "#d8cdf6",
                ink: "#263238",
                slate: "#7a8588",
                mist: "#e8eeec"
              }
            },
            fontFamily: {
              sans: [
                "Hiragino Maru Gothic ProN",
                "Hiragino Sans",
                "Yu Gothic UI",
                "Yu Gothic",
                "Meiryo",
                "system-ui",
                "sans-serif"
              ]
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-nemu-paper text-nemu-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
