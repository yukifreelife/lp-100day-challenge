<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Create Placeholders</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #8b5a3c; }
        .placeholder {
            display: inline-block;
            margin: 10px;
            text-align: center;
        }
        .placeholder img {
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .placeholder p {
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Wheat & Bean - Image Placeholders</h1>
    <div id="placeholders"></div>

    <script>
        const images = [
            { name: 'baguette', color: '#e8d4b8', text: '🥖' },
            { name: 'croissant', color: '#f5e6d3', text: '🥐' },
            { name: 'pancake', color: '#fef3e2', text: '🥞' },
            { name: 'latte', color: '#d4a574', text: '☕' },
            { name: 'drip', color: '#8b5a3c', text: '💧' },
            { name: 'espresso', color: '#3d2b1f', text: '🫘' },
            { name: 'interior-main', color: '#f5f0e8', text: '🏠' },
            { name: 'interior-window', color: '#faf8f5', text: '🪟' },
            { name: 'interior-counter', color: '#e8d5c4', text: '☕' },
            { name: 'interior-detail', color: '#d4c4b0', text: '✨' },
            { name: 'interior-terrace', color: '#e8dcc8', text: '🌿' }
        ];

        const container = document.getElementById('placeholders');

        images.forEach(img => {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = img.color;
            ctx.fillRect(0, 0, 400, 300);

            // Text
            ctx.fillStyle = img.color === '#3d2b1f' ? '#fff' : '#8b5a3c';
            ctx.font = '80px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(img.text, 200, 150);

            // Label
            ctx.fillStyle = img.color === '#3d2b1f' ? '#fff' : '#3d2b1f';
            ctx.font = '14px Arial';
            ctx.fillText(img.name, 200, 270);

            // Create img element
            const wrapper = document.createElement('div');
            wrapper.className = 'placeholder';
            const imgEl = document.createElement('img');
            imgEl.src = canvas.toDataURL('image/jpeg', 0.8);
            imgEl.alt = img.name;
            imgEl.width = 200;

            const label = document.createElement('p');
            label.textContent = img.name + '.jpg';

            wrapper.appendChild(imgEl);
            wrapper.appendChild(label);
            container.appendChild(wrapper);

            // Download link
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/jpeg', 0.8);
            link.download = img.name + '.jpg';
            link.textContent = 'Download ' + img.name + '.jpg';
            link.style.display = 'block';
            link.style.margin = '10px 0';
            link.style.color = '#8b5a3c';
            document.body.appendChild(link);
        });
    </script>
</body>
</html>
