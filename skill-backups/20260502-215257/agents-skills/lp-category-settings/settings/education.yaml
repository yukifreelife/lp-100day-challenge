# 教育LP設定

## 概要
知的で親しみやすい、教育サービス向けのデザイン設定

## カラーパレット
```yaml
primary: "#5B4B9E"      # 知的なパープル
secondary: "#7C73DD"    # ライトパープル
accent: "#FFD166"       # 親しみやすいイエロー
background: "#FFF9E6"   # クリームイエロー
text: "#333333"         # ダークグレー
border: "#E8DFF0"       # ライトパープル
shadow: "rgba(91, 75, 158, 0.1)"
```

## フォント設定
```yaml
japanese:
  primary: "Noto Sans JP, sans-serif"
  fallback: "Hiragino Sans, sans-serif"
  weights: [400, 500, 700]

english:
  primary: "Inter, sans-serif"
  fallback: "Roboto, sans-serif"
  weights: [400, 500, 600, 700]

line_height:
  base: 1.8
  heading: 1.4

letter_spacing:
  base: 0.03em
  heading: 0.05em
```

## セクション構成
```yaml
sections:
  - id: hero
    name: ヒーロー
    required: true
    description: メッセージとビジュアル

  - id: problem
    name: 悩み
    required: true
    description: 学習の悩み、キャリアの悩み

  - id: solution
    name: 解決策
    required: true
    description: カリキュラム、メソッド

  - id: features
    name: 特徴
    required: true
    description: サービスの特徴

  - id: curriculum
    name: カリキュラム
    required: true
    description: 学習内容の明示

  - id: instructors
    name: 講師紹介
    optional: true
    description: 講師プロフィール

  - id: voice
    name: 受講生の声
    required: true
    description: 卒業生の声

  - id: results
    name: 学習成果・実績
    required: true
    description: 成果発表、就職実績

  - id: pricing
    name: 料金
    required: true
    description: コース別料金

  - id: faq
    name: よくある質問
    optional: true
    description: 不安解消Q&A

  - id: cta
    name: 無料体験/お問い合わせ
    required: true
    description: 無料体験、お申し込み
```

