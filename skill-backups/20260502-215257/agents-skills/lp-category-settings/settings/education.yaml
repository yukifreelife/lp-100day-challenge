## コピーパターン
```yaml
hero:
  catch_patterns:
    - "あなたの{目標}を、{方法}で叶える"
    - "{期間}で、{成果}を実感"
    - "誰でも、{目標}になれる"
  sub_patterns:
    - "挫折しない、継続できる学習"
    - "プロから学ぶ、本物の技術"

problem:
  patterns:
    - "こんな悩み、ありませんか？"
    - "勉強しているのに、{不満}"
    - "{目標}への近道が見つからない"

results:
  patterns:
    - "{数値}%の方が、{期間}以内に{成果}"
    - "累計{数値}名以上の卒業生"

cta:
  primary: "無料体験を予約する"
  secondary: "カリキュラムを見る"
  tertiary: "お問い合わせ"
```

## 特有要素
```yaml
trial:
  enabled: true
  duration: "60分"
  types: [online, offline]

learning_support:
  - メンター制度
  - 質問対応
  - 学習管理ツール
  - コミュニティ

results_metrics:
  - 受講満足度
  - 卒業生数
  - 就職・転職実績
  - 目標達成率
```

