## コピーパターン
```yaml
hero:
  catch_patterns:
    - "{課題}を、{解決策}で解決"
    - "{ターゲット}のための{サービス名}"
    - "{数値}の企業が選ぶ{カテゴリー}"
  sub_patterns:
    - "{課題}で悩む担当者様へ"
    - "導入から{期間}で効果を実感"

problem:
  patterns:
    - "こんな課題、ありませんか？"
    - "{課題}に頭を悩ませていませんか？"
    - "これまで、{不満}を感じていませんでしたか？"

benefits:
  patterns:
    - "{数値}%の業務効率化"
    - "平均{期間}でROI達成"
    - "{数値}社以上の導入実績"

cta:
  primary: "無料トライアルを始める"
  secondary: "資料ダウンロード"
  tertiary: "デモを依頼する"
```

## 特有要素
```yaml
metrics:
  - 導入企業数
  - 業務効率化率
  - ROI達成期間
  - 顧客満足度

trust_elements:
  - 導入企業ロゴ
  - お客様の声
  - セキュリティ認証
  - プライバシーマーク
  - サポート体制

pricing_plans:
  - Free: 無料トライアル
  - Basic: 基本プラン
  - Pro: プロフェッショナル
  - Enterprise: エンタープライズ
```

