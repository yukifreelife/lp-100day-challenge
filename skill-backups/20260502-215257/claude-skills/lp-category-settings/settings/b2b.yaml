# B2B/SaaS LP設定

## 概要
プロフェッショナルで信頼感のある、B2B/SaaS向けのデザイン設定

## カラーパレット
```yaml
primary: "#2C5282"      # プロフェッショナルなロイヤルブルー
secondary: "#4A5568"    # グレー
accent: "#48BB78"       # 行動喚起のグリーン（CTAボタン用）
background: "#FFFFFF"   # ホワイト
text: "#1A202C"         # ダークグレー
border: "#E2E8F0"       # ライトグレー
shadow: "rgba(44, 82, 130, 0.1)"
```

## フォント設定
```yaml
japanese:
  primary: "Noto Sans JP, sans-serif"
  fallback: "Hiragino Sans, sans-serif"
  weights: [400, 500, 700]

english:
  primary: "Inter, sans-serif"
  fallback: "Roboto, sans-serif"
  weights: [400, 500, 600, 700]

line_height:
  base: 1.6
  heading: 1.3

letter_spacing:
  base: 0em
  heading: 0.01em
```

## セクション構成
```yaml
sections:
  - id: hero
    name: ヒーロー
    required: true
    description: 価値提案（Value Proposition）

  - id: problem
    name: 課題提示
    required: true
    description: ターゲット企業の課題を明確化

  - id: solution
    name: 解決策
    required: true
    description: サービス概要

  - id: features
    name: 機能・特徴
    required: true
    description: 主要機能の紹介

  - id: benefits
    name: メリット
    required: true
    description: ROI、効率化等の数値メリット

  - id: use-cases
    name: 導入事例
    required: true
    description: 業種別の成功事例

  - id: pricing
    name: 料金プラン
    required: true
    description: プラン別料金

  - id: faq
    name: よくある質問
    optional: true
    description: 導入前の疑問解消

  - id: cta
    name: コールトゥアクション
    required: true
    description: 無料トライアル/お問い合わせ
```

