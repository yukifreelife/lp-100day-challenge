## コピーパターン
```yaml
hero:
  catch_patterns:
    - "{地域}で信頼されている{診療科目}"
    - "患者様に寄り添う、丁寧な診療"
    - "不安を解消する、{特色}のある診療"
  sub_patterns:
    - "最先端の{技術}で、あなたの悩みを解決"
    - "経験豊富な{医師}が、真心を込めて"

problem:
  patterns:
    - "こんな悩み、ありませんか？"
    - "{症状}でお困りではありませんか？"
    - "これまで、{不満}を感じていませんでしたか？"

solution:
  patterns:
    - "{クリニック名}なら、解決できます"
    - "独自の{メソッド}で、根本から改善"

cta:
  primary: "無料カウンセリングを予約する"
  secondary: "詳しく見る"
```

## よくある質問カテゴリー
```yaml
faq_categories:
  - 初診・ご予約について
  - 治療・施術について
  - 料金・保険について
  - アフターケアについて
```

## 特有要素
```yaml
reservation:
  types: [web, phone]
  online_booking: true
  required_fields: [name, phone, email, preferred_date, symptom]

trust_elements:
  - 医師免許・資格
  - 学会所属
  - 診療実績数値
  - 保険適用可否
  - アクセス良さ
```

