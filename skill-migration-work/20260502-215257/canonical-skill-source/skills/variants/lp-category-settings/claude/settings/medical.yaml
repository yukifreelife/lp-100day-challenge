# 医療LP設定

## 概要
信頼感と安心感を重視した、医療機関向けのデザイン設定

## カラーパレット
```yaml
primary: "#4A90A4"      # 信頼感のあるティールブルー
secondary: "#5B7C99"    # ネイビーブルー
accent: "#7CB9E8"       # ライトブルー
background: "#F0F7FA"   # 非常に薄いブルー
text: "#2C3E50"         # ダークスレートグレー
border: "#D4E5ED"       # ライトブルー
shadow: "rgba(74, 144, 164, 0.1)"
```

## フォント設定
```yaml
japanese:
  primary: "Noto Sans JP, sans-serif"
  fallback: "Hiragino Sans, sans-serif"
  weights: [400, 500, 700]

english:
  primary: "Inter, sans-serif"
  fallback: "Helvetica Neue, sans-serif"
  weights: [400, 500, 600]

line_height:
  base: 1.7
  heading: 1.4

letter_spacing:
  base: 0.02em
  heading: 0.05em
```

## セクション構成
```yaml
sections:
  - id: hero
    name: ヒーロー
    required: true
    description: メインビジュアルとクリニックメッセージ

  - id: problem
    name: 悩み・症状
    required: true
    description: 患者様の悩みを提示

  - id: solution
    name: 解決策
    required: true
    description: 治療法・施術内容

  - id: features
    name: 特徴
    required: true
    description: クリニックの特徴・こだわり

  - id: doctors
    name: 医師・スタッフ紹介
    required: true
    description: 経歴、専門分野

  - id: flow
    name: 診療の流れ
    required: true
    description: 初診から治療までの流れ

  - id: voice
    name: 患者様の声
    required: true
    description: 施術経験者の声

  - id: faq
    name: よくある質問
    required: true
    description: 不安解消のためのQ&A

  - id: access
    name: アクセス
    required: true
    description: 地図、診療時間

  - id: reservation
    name: 予約・問い合わせ
    required: true
    description: WEB予約、電話予約
```

## サブカテゴリー別調整
```yaml
歯科医院:
  tone: "清潔・信頼"
  primary_color: "#4A90A4"
  secondary_color: "#5B7C99"
  accent_color: "#7CB9E8"
  key_sections: [problem, solution, doctors, flow, voice]
  specific_features:
    - 痛みへの配慮
    - 最新設備
    - セカンドオピニオン

美容皮膚科:
  tone: "エレガント・美しさ"
  primary_color: "#E8B4B8"
  secondary_color: "#C49A9E"
  accent_color: "#F5D5D8"
