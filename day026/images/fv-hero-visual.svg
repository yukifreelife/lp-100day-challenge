<svg width="1536" height="1024" viewBox="0 0 1536 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-visual-title hero-visual-desc">
  <title id="hero-visual-title">LP workflow visual</title>
