<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
        <linearGradient id="originGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6b5210;stop-opacity:0.3"/>
            <stop offset="100%" style="stop-color:#a67c52;stop-opacity:1"/>
        </linearGradient>
    </defs>
    <rect width="100%" height="100%" fill="#a67c52"/>

    <!-- Coffee farm illustration -->
    <circle cx="200" cy="150" r="100" fill="#6b5210" opacity="0.3"/>

    <!-- Mountains/hills -->
    <path d="M 0 300 Q 133 150 200 120 L 400 300 Z" fill="#6b5210" opacity="0.2"/>

    <!-- Coffee cherries -->
    <g transform="translate(200, 150)">
        <circle cx="0" cy="-30" r="12" fill="#c4a35a"/>
        <circle cx="20" cy="-25" r="11" fill="#b33d22"/>
        <circle cx="-15" cy="-20" r="10" fill="#a02820"/>
    </g>

    <!-- Country icon -->
    <text x="200" y="270" font-size="60" text-anchor="middle">🌱</text>
</svg>