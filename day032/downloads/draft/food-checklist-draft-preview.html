<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食事管理チェックリスト（仮デザイン確認）</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        background: #f7f3ec;
        color: #352d28;
        font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
        line-height: 1.7;
      }

      .wrap {
        width: min(92vw, 920px);
        margin: 28px auto;
      }

      .note {
        border: 1px solid #e5d7c7;
        border-radius: 14px;
        background: #fff8ef;
        padding: 14px 16px;
        color: #5a4a3f;
        font-size: 0.95rem;
      }

      .card {
        margin-top: 14px;
        border: 1px solid #e0d3c4;
        border-radius: 16px;
        background: #fffdf9;
        box-shadow: 0 10px 24px rgba(88, 68, 50, 0.08);
        padding: 22px;
      }

      .card h1 {
        margin: 0 0 8px;
        font-size: clamp(1.25rem, 2vw, 1.6rem);
        color: #7a4f35;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.96rem;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="note">
        <strong>仮デザイン確認用</strong><br />
        このページは「内容確定前の確認用」です。本文修正は
        <code>food-checklist-draft.txt</code> を直接編集してください。
      </section>
      <section class="card">
        <h1>初心者でも続く 食事管理チェックリスト（プレビュー）</h1>
        <pre id="content">読み込み中...</pre>
      </section>
    </main>

    <script>
      (async function () {
        const el = document.getElementById("content");
        try {
          const res = await fetch("./food-checklist-draft.txt");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          el.textContent = await res.text();
        } catch (_error) {
          el.textContent = "food-checklist-draft.txt を読み込めませんでした。";
        }
      })();
    </script>
  </body>
</html>
